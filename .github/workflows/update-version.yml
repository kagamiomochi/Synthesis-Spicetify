name: Update VERSION on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update VERSION in synthesis-spicetify.js
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          sed -i "s|/\* VERSION \*/ const VERSION = \"[^\"]*\";|/* VERSION */ const VERSION = \"${TAG}\";|" synthesis-spicetify.js

      - name: Commit and push
        run: |
          # Never move main backwards: the tagged commit has to contain everything that is on main.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "The tag is not at (or ahead of) the tip of main; not updating VERSION on main." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add synthesis-spicetify.js
          git diff --cached --quiet || git commit -m "chore: update VERSION to ${GITHUB_REF#refs/tags/}"
          git push origin HEAD:main
